name: Golden Rose product media verification

on:
  pull_request:
    paths:
      - "app/workspace/products/**"
      - "src/lib/golden-rose/product-images.ts"
      - "supabase/migrations/*owner_product_media*.sql"
      - ".github/workflows/product-media-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify TypeScript
        run: npx tsc --noEmit
      - name: Verify ESLint
        run: npm run lint
      - name: Build Next.js
        run: npm run build
